<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personalmakers AI</title>
<style>
:root { --bg:#f6f7f9; --panel:#ffffff; --border:#e5e8ee; --ink:#1a1d23; --ink-mid:#4a5160; --ink-soft:#8a91a0; --accent:#2f6bff; --accent-soft:#eef3ff; --font:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { font-family:var(--font); background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:10px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; }
.logo { background:var(--accent); color:#fff; font-size:11px; font-weight:800; padding:4px 9px; border-radius:6px; letter-spacing:.3px; }
.htitle { font-weight:700; font-size:14px; }
.hsub { font-size:11px; color:var(--ink-soft); }
.hspace { flex:1; }
.hbtn { border:1px solid var(--border); background:#fff; border-radius:8px; padding:6px 12px; font-size:12px; font-weight:600; color:var(--ink-mid); cursor:pointer; font-family:var(--font); white-space:nowrap; transition:all .15s; }
.hbtn:hover { border-color:var(--accent); color:var(--accent); }
main { flex:1; overflow-y:auto; }
.chatwrap { max-width:820px; margin:0 auto; padding:28px 20px 20px; display:flex; flex-direction:column; gap:22px; }
.empty { text-align:center; padding:60px 20px; color:var(--ink-soft); }
.empty .big { font-size:34px; margin-bottom:14px; }
.empty h3 { color:var(--ink); font-size:18px; margin-bottom:8px; font-weight:700; }
.empty p { font-size:13.5px; line-height:1.7; }
.sugs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; }
.sug { border:1px solid var(--border); background:#fff; border-radius:20px; padding:8px 14px; font-size:12.5px; color:var(--ink-mid); cursor:pointer; transition:all .15s; }
.sug:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
.msg-u { align-self:flex-end; max-width:78%; background:var(--accent); color:#fff; padding:12px 16px; border-radius:16px 16px 4px 16px; font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
.msg-u .att { display:block; font-size:11.5px; opacity:.85; margin-top:6px; }
.msg-a { align-self:stretch; display:flex; gap:12px; }
.avatar { width:30px; height:30px; border-radius:8px; background:var(--accent); color:#fff; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
.bubble { flex:1; background:var(--panel); border:1px solid var(--border); border-radius:4px 16px 16px 16px; padding:16px 20px; min-width:0; }
.atext { font-size:14.2px; line-height:1.75; word-break:break-word; }
.atext b { font-weight:700; }
.atext h4 { font-size:14.5px; margin:14px 0 6px; }
.cursor { display:inline-block; width:8px; height:16px; background:var(--accent); border-radius:2px; animation:blink 1s infinite; vertical-align:text-bottom; }
@keyframes blink { 50% { opacity:.2; } }
</style>
</head>
